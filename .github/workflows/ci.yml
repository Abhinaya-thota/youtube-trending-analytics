name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Run the scripts on synthetic data
        run: |
          python make_sample_data.py --videos 300
          python findings_check.py data/sample/US_youtube_trending_data.csv --min-videos 10
          python sentiment_analysis.py data/sample/US_youtube_trending_data.csv
          python compare_countries.py data/sample
